[package]
name = "grimoire-desktop"
version = "0.1.0"
description = "Grimoire Desktop — native Tauri v2 novel reader"
authors = ["Operation-Grimoire"]
edition = "2021"

[lib]
name = "grimoire_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
